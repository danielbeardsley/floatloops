<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep Bass bench</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e8f0;
        --dim: #8c8ca0;
        --line: #2c2c3c;
        --hot: #ff9d5c;
      }
      body {
        margin: 0;
        padding: 20px;
        background: #12121a;
        color: var(--ink);
        font: 14px/1.5 system-ui, sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.blurb {
        margin: 0 0 20px;
        color: var(--dim);
        max-width: 60ch;
      }
      .bench {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }
      .knobs {
        display: grid;
        grid-template-columns: 7em 1fr 4.5em;
        gap: 8px 12px;
        align-items: center;
        min-width: 380px;
      }
      .knobs label {
        color: var(--dim);
      }
      .knobs output {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .knobs .note {
        grid-column: 1 / -1;
        color: var(--dim);
        font-size: 12px;
        margin: -4px 0 6px;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--hot);
      }
      button,
      select {
        font: inherit;
        color: var(--ink);
        background: #1d1d2a;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
      }
      button:hover {
        border-color: var(--hot);
      }
      button.playing {
        background: var(--hot);
        color: #12121a;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .keys {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .keys button {
        padding: 6px 8px;
        min-width: 44px;
      }
      canvas {
        display: block;
        background: #0b0b12;
        border-radius: 6px;
        width: 320px;
        height: 120px;
      }
      pre {
        margin: 12px 0 0;
        padding: 12px;
        background: #0b0b12;
        border-radius: 6px;
        font-size: 12px;
        color: var(--dim);
        white-space: pre-wrap;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <h1>Deep Bass bench</h1>
    <p class="blurb">
      Every number the Deep Bass voice is made of, on a slider, while a riff
      plays. Changes land on the next note. Dev only -- this page is not part
      of the app build.
    </p>
    <div class="bench">
      <div class="panel">
        <div class="row">
          <button id="play">Play riff</button>
          <select id="pattern"></select>
          <label for="tempo" style="color: var(--dim)">Tempo</label>
          <input id="tempo" type="range" min="60" max="160" step="1" style="width: 100px" />
          <output id="tempo-out"></output>
        </div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="panel knobs" id="knobs"></div>
      <div class="panel">
        <canvas id="scope" width="640" height="240"></canvas>
        <div class="row" style="margin: 12px 0 0">
          <button id="reset">Reset to shipped</button>
        </div>
        <pre id="code"></pre>
      </div>
    </div>
    <script type="module" src="./deep-bass.ts"></script>
  </body>
</html>
